# 站点公共配置：由 http.conf / https.conf 在 server 块内 include。
#
# 访问控制：所有页面与接口都要求 Basic 认证（账号见 deploy/htpasswd，用 deploy/add-user.sh 维护）。
# 系统本身没有账号体系，案卷是客户机密，这一层不能省。
auth_basic "legal-doc-gen";
auth_basic_user_file /etc/nginx/htpasswd;

# 扫描版合同可能几十页、几十 MB
client_max_body_size 100m;

# 安全响应头（只在 server 级设置：location 里再写 add_header 会让这些失效）
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

root /usr/share/nginx/html;

# 构建产物带内容哈希，可长期缓存；index.html 不缓存，保证更新后立即生效
location /assets/ {
    expires 30d;
    try_files $uri =404;
}
location = /index.html {
    expires -1;
}
location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 浏览器的 Basic 认证凭据只给 nginx 用，不转给后端
    proxy_set_header Authorization "";
    # 分析含多次 LLM 调用与按需 OCR，可能持续数分钟
    proxy_connect_timeout 10s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
