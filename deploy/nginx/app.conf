# 站点公共配置：由 http.conf / https.conf 在 server 块内 include。
#
# 访问控制由后端负责：除登录接口外所有 /api 都要求已登录（会话 Cookie，见 backend/app/routers/auth.py）。
# 静态页面本身不含任何案件数据，未登录时前端显示登录页。

# 扫描版合同可能几十页、几十 MB
client_max_body_size 100m;

# 安全响应头（只在 server 级设置：location 里再写 add_header 会让这些失效）
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

root /usr/share/nginx/html;

# 构建产物带内容哈希，可长期缓存；index.html 不缓存，保证更新后立即生效
location /assets/ {
    expires 30d;
    try_files $uri =404;
}
location = /index.html {
    expires -1;
}
location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 分析含多次 LLM 调用与按需 OCR，可能持续数分钟
    proxy_connect_timeout 10s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
