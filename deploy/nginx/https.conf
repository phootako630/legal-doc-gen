# HTTPS 模式：公网访问必须用这个。证书在 deploy/certs/fullchain.pem 与 privkey.pem
# （deploy/cert.sh 申请的 Let's Encrypt 免费证书，或云厂商证书的「Nginx」格式，见 deploy/README.md）。
server_tokens off;

# HTTP 一律跳转 HTTPS（证书续期的域名验证除外）
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/acme.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/app.conf;
}
