[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-investigator"
version = "0.1.0"
description = "Graceful investigation loops for LangGraph: bounded rounds, budget limits, confidence-based routing, and human escalation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "langgraph-investigator contributors" }]
keywords = ["langgraph", "langchain", "agents", "investigation", "rca", "escalation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/phootako630/legal-doc-gen"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
